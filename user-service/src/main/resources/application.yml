server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: checkoutline
    password: checkoutline

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    # Demo-only secret — override with an env var (SECURITY_JWT_SECRET) in any real deployment.
    secret: ${SECURITY_JWT_SECRET:checkoutline-dev-secret-change-me-checkoutline-dev-secret}
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.checkoutline: INFO
